services:
  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      sh -c "composer install --no-interaction --prefer-dist && php artisan migrate --force && php-fpm"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oapteka}
      DB_USERNAME: ${DB_USERNAME:-oapteka}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy
    networks: [traefik-net, internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www:ro
      - vendor:/var/www/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [traefik-net, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.oapteka.rule=Host(`${TRAEFIK_HOST:-oapteka.test}`)
      - traefik.http.routers.oapteka.entrypoints=web
      - traefik.http.services.oapteka.loadbalancer.server.port=80

  queue:
    build:
      context: .
      target: development
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      sh -c "until test -f vendor/autoload.php; do sleep 2; done; php artisan queue:work --queue=price-list-imports,default --sleep=2 --tries=3 --timeout=120"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oapteka}
      DB_USERNAME: ${DB_USERNAME:-oapteka}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      PRICE_LIST_QUEUE: price-list-imports
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  scheduler:
    build:
      context: .
      target: development
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      sh -c "until test -f vendor/autoload.php; do sleep 2; done; php artisan schedule:work"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oapteka}
      DB_USERNAME: ${DB_USERNAME:-oapteka}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: database
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-oapteka}
      POSTGRES_USER: ${DB_USERNAME:-oapteka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]

networks:
  traefik-net:
    external: true
  internal:

volumes:
  postgres-data:
  vendor:
