# Never include query strings (OAuth codes/state) in access logs.
log_format gmail_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log gmail_safe;
    listen 80;
    server_name ${TRAEFIK_HOST};
    root /var/www/public;
    index index.php;
    client_max_body_size 25m;
    location = /build/manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /build/ {
        location ~ "^/build/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(css|js)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        # Identify the Nginx gateway; Traefik supplies the client address in X-Forwarded-For.
        fastcgi_param REMOTE_ADDR ${NGINX_PRIVATE_ADDRESS};
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }
    location ~* \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
    location ^~ /storage/ { return 404; }
}
